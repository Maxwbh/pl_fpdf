name: Publicar o site

# O site saiu da raiz do repositório e passou a viver em `site/`. O GitHub Pages
# só sabe servir a raiz ou `docs/` sozinho — qualquer outra pasta precisa de um
# workflow que publique o conteúdo. É este.
#
# Uma vez, na mão: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # Publicado um release estável, o release.yml dispara este workflow por
  # workflow_dispatch: a validação abaixo recusa anunciar como estável uma
  # versão cujo release ainda não existe, então o push que traz a versão nova
  # chega antes da tag e só o release a pública. (Um `release: published`
  # aqui não serviria: o release e criado com o token do Actions, e evento
  # desse token não dispara outro workflow.)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publicação é estado, não fila: se dois pushes chegarem juntos, o último vence
# e o anterior é cancelado.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o lastmod do sitemap é conferido contra o histórico

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Antes de publicar, fecha o ciclo spec -> documentação gerada -> release
      # -> site: o HTML esta em dia com a spec, todo link interno existe, a
      # versão anunciada bate com o código e com os releases do GitHub, e os
      # links de download respondem. Falhou, não pública.
      - name: O site em dia com a spec
        run: python dev/scripts/gen_docs/generate.py --check
      - name: Links internos
        run: python dev/scripts/gen_docs/check_links.py
      - name: Versão anunciada x código x releases publicados
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python dev/scripts/gen_docs/check_publicacao.py --online
      - name: Links de release, instalador e site respondem
        run: python dev/scripts/gen_docs/check_links_externos.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
