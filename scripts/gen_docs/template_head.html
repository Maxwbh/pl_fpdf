<meta property="og:description" content="Sintaxe, parâmetros com valores possíveis, retorno, erros e exemplos de cada API do PL_FPDF.">

<style>
  :root{
    --bg:#0b1422; --bg2:#101f36; --panel:#0a121e; --panelbar:#0e1929;
    --cardbg:rgba(18,32,54,.62); --cardbd:#243d5e; --cardbd-h:#33578a;
    --fg:#f2f6fb; --muted:#9db8d4; --faint:#69829f;
    --accent:#e8503a; --accent2:#ff7a55; --blue:#6fb3e8;
    --code:#7fd1a8; --line:#1d3350; --chipbg:rgba(111,179,232,.09);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f3f7fc; --bg2:#e7eef8; --panel:#0d1828; --panelbar:#101d30;
      --cardbg:rgba(255,255,255,.82); --cardbd:#d4e0ef; --cardbd-h:#a9c2de;
      --fg:#0f1f33; --muted:#41607f; --faint:#6d87a3;
      --accent:#d8452f; --accent2:#f06544; --blue:#2779c0;
      --line:#d8e2ef; --chipbg:rgba(39,121,192,.07);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;color:var(--fg);line-height:1.6;
       font-family:'Inter',-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
       background:linear-gradient(165deg,var(--bg),var(--bg2))}
  a{color:inherit}
  nav{position:sticky;top:0;z-index:60;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      background:rgba(11,20,34,.72);border-bottom:1px solid var(--line)}
  @media (prefers-color-scheme: light){ nav{background:rgba(243,247,252,.8)} }
  .nav-in{display:flex;align-items:center;gap:22px;height:60px;max-width:1400px;margin:0 auto;padding:0 22px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;text-decoration:none}
  .brand .f{color:var(--accent)}
  .mark{width:26px;height:26px}
  .nav-in .right{margin-left:auto;display:flex;gap:18px}
  .nav-in .right a{text-decoration:none;font-size:14px;color:var(--muted);font-weight:500}
  .nav-in .right a:hover{color:var(--fg)}

  .layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:34px;
          max-width:1400px;margin:0 auto;padding:0 22px}
  .sidebar{position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:22px 0 40px}
  .side-in{padding-right:8px}
  .filter{width:100%;padding:9px 12px;margin-bottom:16px;border-radius:9px;
          border:1px solid var(--cardbd);background:var(--cardbg);color:var(--fg);font-size:13.5px;font-family:inherit}
  .filter::placeholder{color:var(--faint)}
  .side-group h4{margin:16px 0 6px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
  .side-group ul{list-style:none;margin:0;padding:0}
  .side-group li a{display:block;padding:3px 8px;border-radius:6px;font-size:13px;color:var(--muted);
                   text-decoration:none;font-family:'JetBrains Mono',monospace}
  .side-group li a:hover{background:var(--chipbg);color:var(--fg)}
  .side-group li a.active{color:var(--accent);font-weight:600}

  .content{padding:26px 0 60px;min-width:0}
  header.page{margin-bottom:26px}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:600;letter-spacing:2.2px;
          text-transform:uppercase;color:var(--accent);margin:0 0 8px}
  .kicker::before{content:"";width:24px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  h1{font-size:clamp(26px,3.6vw,38px);letter-spacing:-1px;margin:0 0 10px;font-weight:800}
  .lead{color:var(--muted);max-width:720px;margin:0;font-size:15.5px}
  .lead a{color:var(--fg)}

  h2.grp{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);
         margin:44px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--line)}

  .api{border:1px solid var(--cardbd);border-radius:14px;background:var(--cardbg);
       padding:22px 24px;margin:0 0 18px;scroll-margin-top:76px}
  .api h3{margin:0 0 8px;font-size:20px;font-weight:800;letter-spacing:-.3px;
          font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .kind{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;letter-spacing:.8px;
        text-transform:uppercase;color:var(--blue);border:1px solid var(--cardbd);
        border-radius:999px;padding:2px 10px;background:var(--chipbg)}
  .anchor{margin-left:auto;color:var(--faint);text-decoration:none;font-size:15px}
  .anchor:hover{color:var(--accent)}
  .api h5{margin:18px 0 8px;font-size:11.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
  .api p.d{margin:0;color:var(--muted);font-size:14.5px}
  .api p.see{margin:16px 0 0;font-size:13.5px;color:var(--muted)}
  .api p.see a{color:var(--blue);text-decoration:none}
  .api p.see a:hover{text-decoration:underline}

  .code{background:var(--panel);border:1px solid #223a5a;border-radius:10px;overflow:hidden;margin:0 0 8px}
  .code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:'JetBrains Mono',Consolas,monospace;
            font-size:12.5px;line-height:1.65;color:var(--code)}
  .code .k{color:#6fb3e8} .code .s{color:#e8c07d} .code .c{color:#54718f}

  .tbl{border:1px solid var(--cardbd);border-radius:10px;overflow-x:auto;margin:0 0 6px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;background:var(--chipbg);color:var(--faint);font-weight:600;
           font-size:11px;letter-spacing:.7px;text-transform:uppercase;padding:8px 12px;white-space:nowrap}
  td{padding:8px 12px;border-top:1px solid var(--cardbd);color:var(--muted);vertical-align:top}
  td.pname{font-family:'JetBrains Mono',monospace;color:var(--fg);white-space:nowrap;font-size:12.5px}
  td.ptype{font-family:'JetBrains Mono',monospace;color:var(--blue);white-space:nowrap;font-size:12px}
  td.pval{min-width:200px}
  td code{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--fg)}

  footer{border-top:1px solid var(--line);padding:24px 22px 40px;text-align:center;
         font-size:13.5px;color:var(--faint);max-width:1400px;margin:0 auto}
  footer a{color:var(--muted);text-decoration:none}
  footer a:hover{color:var(--fg)}
  .top{position:fixed;right:20px;bottom:20px;width:40px;height:40px;border-radius:50%;
       display:flex;align-items:center;justify-content:center;text-decoration:none;
       background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:18px;
       box-shadow:0 8px 22px rgba(232,80,58,.4);z-index:60}

  @media (max-width: 620px){
    .nav-in{gap:12px;padding:0 14px}
    .nav-in .right{gap:12px}
    .nav-in .right a.hide-s{display:none}
    .brand span[style]{display:none}
    .layout{padding:0 14px}
  }
  @media (max-width: 1000px){
    .layout{grid-template-columns:1fr;gap:0}
    .sidebar{position:static;height:auto;overflow:visible;padding:16px 0 0;
             border-bottom:1px solid var(--line);margin-bottom:10px}
    .side-group ul{display:flex;flex-wrap:wrap;gap:4px}
    .side-group li a{padding:3px 10px;border:1px solid var(--cardbd);border-radius:999px;font-size:12px}
  }
</style>
</head>

      <path d="M60 18v16h16" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linejoin="round"/>
      <path d="M34 56h32M34 68h22" stroke="var(--blue)" stroke-width="7" stroke-linecap="round"/>

  </div>
</div></nav>
