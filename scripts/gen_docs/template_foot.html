<script>
(function(){
  var f = document.querySelector('.filter');
  if (f) f.addEventListener('input', function(){
    var q = this.value.toLowerCase();
    document.querySelectorAll('.side-group').forEach(function(g){
      var vis = 0;
      g.querySelectorAll('li').forEach(function(li){
        var hit = li.textContent.toLowerCase().indexOf(q) !== -1;
        li.style.display = hit ? '' : 'none';
        if (hit) vis++;
      });
      g.style.display = vis ? '' : 'none';
    });
  });
  var links = [].slice.call(document.querySelectorAll('.side-group a'));
  var obs = new IntersectionObserver(function(es){
    es.forEach(function(e){
      if (!e.isIntersecting) return;
      links.forEach(function(a){
        a.classList.toggle('active', a.getAttribute('href') === '#' + e.target.id);
      });
    });
  }, {rootMargin: '-70px 0px -75% 0px'});
  document.querySelectorAll('article.api').forEach(function(a){ obs.observe(a); });
})();
</script>
